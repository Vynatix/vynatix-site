<!-- The site header. tools/seo-head.py writes it in place of the header of every page on each run, so a change to
     the menu, the logo or the buttons is made here, once, and the script run (python3 tools/seo-head.py); it is
     never edited in the pages. Not published: tools/ is excluded in _config.yml.

     The header is the fragment below, the lines between <template id="header"> and </template>. What differs from
     page to page is named as ${name}:
       ${lang}     lang="en" on a page written by hand, where the header stays English (the Swedish pages
                   included), and nothing on a page of a generated language, which translates it with the rest.
       ${current}  on the line of each link of the menu: aria-current="page" on the link to the page itself,
                   nothing on the others. Each line that names it holds one link.
     Everything else is copied as it stands. A dollar sign is written $$. -->
<template id="header">
  <!-- ============================================================ Header -->
  <header class="site-header" role="banner"${lang}>
    <div class="site-header__inner">
      <a href="index.html" class="site-header__logo" aria-label="Vynatix home">
        <svg class="vx-wordmark" viewBox="0 0 2654.79 653.758" width="122" height="30" aria-hidden="true" focusable="false"><use href="#vx-wordmark"/></svg>
      </a>
      <button class="icon-btn mobile-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="primary-nav">

        <svg class="icon icon--close" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m250.92-218.92-32-32L448-480 218.92-709.08l32-32L480-512l229.08-229.08 32 32L512-480l229.08 229.08-32 32L480-448 250.92-218.92Z"/></svg>
      </button>
      <nav class="site-header__nav" id="primary-nav" aria-label="Primary">
